<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Alpaslan Ozbas</title>
    <link rel="stylesheet" href="../style.css" />
    <script type="module" src="../global.js"></script>
  </head>
  <body>
    <main>
      <h1>Contact</h1>
      <p>This form opens your email app. Review and send the draft there.</p>
      <form action="mailto:aozbas@ucsd.edu" method="POST" enctype="text/plain">
        <label>
          Your email
          <input type="email" name="email" autocomplete="email" required />
        </label>
        <label>
          Subject
          <input name="subject" required />
        </label>
        <label>
          Message
          <textarea name="body" rows="6" cols="30" required></textarea>
        </label>
        <button type="submit">Open email draft</button>
      </form>
    </main>
  </body>
</html>
